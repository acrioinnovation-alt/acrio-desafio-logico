          cp balancas/*.jpg android/app/src/main/assets/balancas/
      - name: Upload balance images for verification
        uses: actions/upload-artifact@v4
        with:
          name: Balance-Images
          path: balancas/*.jpg
          retention-days: 14
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Desafio-Logico-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
