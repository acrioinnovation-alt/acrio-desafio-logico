name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare offline game assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html game.js fases.js matchsticks.js squares.js balance.js android/app/src/main/assets/
          mkdir -p android/app/src/main/assets/balancas
      - name: Download today's 40 balance images from Dropbox for inspection
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p balancas-novas
          curl --retry 3 --retry-all-errors --max-time 180 -fLsS 'https://www.dropbox.com/scl/fo/fcb3dat2zcjiw8rmipfqj/AFFO4GI2JyUDIUuSOPYwPys?rlkey=ug92c9s9xzi4vmvacav1tlyww&dl=1' -o /tmp/balancas-40.zip
          unzip -t /tmp/balancas-40.zip
          unzip -jo /tmp/balancas-40.zip '*.jpg' -d balancas-novas
          test "$(find balancas-novas -maxdepth 1 -type f -iname '*.jpg' | wc -l)" -eq 40
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          from pathlib import Path
          import csv
          files=sorted(Path("balancas-novas").glob("*.jpg"))
          rows=[]
          thumbs=[]
          for p in files:
              im=Image.open(p)
              rows.append((p.name, im.width, im.height, im.mode, p.stat().st_size))
              im.thumbnail((300,210))
              tile=Image.new("RGB",(320,250),"white")
              tile.paste(im,((320-im.width)//2,5))
              ImageDraw.Draw(tile).text((8,222),f"{p.name} | {rows[-1][1]}x{rows[-1][2]}",fill="black")
              thumbs.append(tile)
          with open("balancas-novas/relatorio-resolucao.csv","w",newline="",encoding="utf-8") as f:
              w=csv.writer(f); w.writerow(["arquivo","largura","altura","modo","bytes"]); w.writerows(rows)
          sheet=Image.new("RGB",(320*5,250*8),"#dddddd")
          for i,tile in enumerate(thumbs): sheet.paste(tile,((i%5)*320,(i//5)*250))
          sheet.save("balancas-novas/contato-40.jpg",quality=90)
          PY
      - name: Upload today's 40 images and visual contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: Balance-Images-40-Nov-21
          path: |
            balancas-novas/*.jpg
            balancas-novas/*.csv
          retention-days: 14
      - name: Package 32 validated balance puzzles for offline gameplay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p balancas android/app/src/main/assets/balancas
          files=(
            IMG-20261121-WA1629.jpg
            IMG-20261121-WA0053.jpg
            IMG-20261121-WA2151.jpg
            IMG-20261121-WA6420.jpg
            IMG-20261121-WA4390.jpg
            IMG-20261121-WA5807.jpg
            IMG-20261121-WA8959.jpg
            IMG-20261121-WA5479.jpg
            IMG-20261121-WA8817.jpg
            IMG-20261121-WA1361.jpg
            IMG-20261121-WA5063.jpg
            IMG-20261121-WA8137.jpg
            IMG-20261121-WA4204.jpg
            IMG-20261121-WA6608.jpg
            IMG-20261121-WA3671.jpg
            IMG-20261121-WA3991.jpg
            IMG-20261121-WA8421.jpg
            IMG-20261121-WA9428.jpg
            IMG-20261121-WA6259.jpg
            IMG-20261121-WA6983.jpg
            IMG-20261121-WA7734.jpg
            IMG-20261121-WA1455.jpg
            IMG-20261121-WA1636.jpg
            IMG-20261121-WA1698.jpg
            IMG-20261121-WA2387.jpg
            IMG-20261121-WA2818.jpg
            IMG-20261121-WA7085.jpg
            IMG-20261121-WA7843.jpg
            IMG-20261121-WA0925.jpg
            IMG-20261121-WA2049.jpg
            IMG-20261121-WA4633.jpg
            IMG-20261121-WA8786.jpg
          )
          i=1
          for file in "${files[@]}"; do
            test -s "balancas-novas/$file"
            printf -v target 'desafio-%02d.jpg' "$i"
            cp "balancas-novas/$file" "balancas/$target"
            cp "balancas-novas/$file" "android/app/src/main/assets/balancas/$target"
            i=$((i+1))
          done
          test "$(find balancas -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 32
          test "$(find android/app/src/main/assets/balancas -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 32
      - name: Restore the 10 original balance puzzles without replacing the 32 new ones
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p balancas-antigas balancas android/app/src/main/assets/balancas
          curl --retry 3 --retry-all-errors --max-time 180 -fLsS 'https://www.dropbox.com/scl/fo/xn2lmolz4fbdyle8u67il/AAev7fQWfeI_OTlPysjKTrk?rlkey=bhhk9q0y1qzpm80k4lvzxgd26&st=k6egz5ga&dl=1' -o /tmp/balancas-originais.zip
          unzip -t /tmp/balancas-originais.zip
          unzip -jo /tmp/balancas-originais.zip '*.jpg' -d balancas-antigas
          old_files=(
            IMG-20261120-WA9535.jpg
            IMG-20261120-WA4075.jpg
            IMG-20261120-WA3868.jpg
            IMG-20261120-WA4794.jpg
            IMG-20261120-WA7909.jpg
            IMG-20261120-WA1893.jpg
            IMG-20261120-WA7674.jpg
            IMG-20261120-WA2840.jpg
            IMG-20261120-WA9530.jpg
            IMG-20261120-WA6148.jpg
          )
          i=33
          for file in "${old_files[@]}"; do
            test -s "balancas-antigas/$file"
            printf -v target 'desafio-%02d.jpg' "$i"
            cp "balancas-antigas/$file" "balancas/$target"
            cp "balancas-antigas/$file" "android/app/src/main/assets/balancas/$target"
            i=$((i+1))
          done
          test "$(find balancas -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 42
          test "$(find android/app/src/main/assets/balancas -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 42
      - name: Download and inspect the 8 additional balance images from Dropbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p balancas-adicionais
          curl --retry 3 --retry-all-errors --max-time 180 -fLsS 'https://www.dropbox.com/scl/fo/mz6c0esiy03bl5l3urdtl/AIeQ-7XZPHR3cFdr5Q96NNg?rlkey=4s1yuj3de8fo686wi1mu79sud&st=v90i159y&dl=1' -o /tmp/balancas-adicionais.zip
          unzip -t /tmp/balancas-adicionais.zip
          unzip -jo /tmp/balancas-adicionais.zip '*.jpg' -d balancas-adicionais
          test "$(find balancas-adicionais -maxdepth 1 -type f -iname '*.jpg' | wc -l)" -eq 8
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          import csv
          files=sorted(Path("balancas-adicionais").glob("*.jpg"))
          rows=[]
          tiles=[]
          for p in files:
              im=Image.open(p).convert("RGB")
              rows.append((p.name,im.width,im.height,p.stat().st_size))
              im.thumbnail((480,330))
              tile=Image.new("RGB",(500,375),"white")
              tile.paste(im,((500-im.width)//2,5))
              ImageDraw.Draw(tile).text((10,345),p.name,fill="black")
              tiles.append(tile)
          with open("balancas-adicionais/relatorio.csv","w",newline="",encoding="utf-8") as f:
              w=csv.writer(f);w.writerow(["arquivo","largura","altura","bytes"]);w.writerows(rows)
          sheet=Image.new("RGB",(1000,1500),"#dddddd")
          for i,tile in enumerate(tiles):sheet.paste(tile,((i%2)*500,(i//2)*375))
          sheet.save("balancas-adicionais/contato-8.jpg",quality=92)
          PY
      - name: Upload the 8 additional balance images for validation
        uses: actions/upload-artifact@v4
        with:
          name: Balance-Images-8-Nov-21
          path: |
            balancas-adicionais/*.jpg
            balancas-adicionais/*.csv
          retention-days: 14
      - name: Add the 8 additional balance puzzles without replacing the 42 existing ones
        shell: bash
        run: |
          set -euo pipefail
          files=(
            IMG-20261121-WA1908.jpg
            IMG-20261121-WA2983.jpg
            IMG-20261121-WA3975.jpg
            IMG-20261121-WA4404.jpg
            IMG-20261121-WA4877.jpg
            IMG-20261121-WA7769.jpg
            IMG-20261121-WA9291.jpg
            IMG-20261121-WA9898.jpg
          )
          i=43
          for file in "${files[@]}"; do
            test -s "balancas-adicionais/$file"
            printf -v target 'desafio-%02d.jpg' "$i"
            cp "balancas-adicionais/$file" "balancas/$target"
            cp "balancas-adicionais/$file" "android/app/src/main/assets/balancas/$target"
            i=$((i+1))
          done
          test "$(find balancas -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 50
          test "$(find android/app/src/main/assets/balancas -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 50
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Desafio-Logico-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
