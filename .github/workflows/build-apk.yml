name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare offline game assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html game.js fases.js matchsticks.js balance.js android/app/src/main/assets/
          mkdir -p android/app/src/main/assets/balancas
      - name: Download the original balance image folder from Dropbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p balancas android/app/src/main/assets/balancas
          curl --retry 3 --retry-all-errors --max-time 180 -fLsS 'https://www.dropbox.com/scl/fo/xn2lmolz4fbdyle8u67il/AAev7fQWfeI_OTlPysjKTrk?rlkey=bhhk9q0y1qzpm80k4lvzxgd26&st=k6egz5ga&dl=1' -o /tmp/balancas-dropbox.zip
          unzip -t /tmp/balancas-dropbox.zip
          unzip -jo /tmp/balancas-dropbox.zip '*.jpg' -d balancas
          mv balancas/IMG-20261120-WA9535.jpg balancas/desafio-01.jpg
          mv balancas/IMG-20261120-WA4075.jpg balancas/desafio-02.jpg
          mv balancas/IMG-20261120-WA3868.jpg balancas/desafio-03.jpg
          mv balancas/IMG-20261120-WA4794.jpg balancas/desafio-04.jpg
          mv balancas/IMG-20261120-WA7909.jpg balancas/desafio-05.jpg
          mv balancas/IMG-20261120-WA1893.jpg balancas/desafio-06.jpg
          mv balancas/IMG-20261120-WA7674.jpg balancas/desafio-07.jpg
          mv balancas/IMG-20261120-WA2840.jpg balancas/desafio-08.jpg
          mv balancas/IMG-20261120-WA9530.jpg balancas/desafio-09.jpg
          mv balancas/IMG-20261120-WA6148.jpg balancas/desafio-10.jpg
          test "$(find balancas -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 10
          cp balancas/*.jpg android/app/src/main/assets/balancas/
      - name: Upload balance images for verification
        uses: actions/upload-artifact@v4
        with:
          name: Balance-Images
          path: balancas/*.jpg
          retention-days: 14
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Desafio-Logico-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
