name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare offline game assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html game.js fases.js matchsticks.js balance.js android/app/src/main/assets/
          mkdir -p android/app/src/main/assets/balancas
      - name: Download the original balance image folder from Dropbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p balancas android/app/src/main/assets/balancas
          curl --retry 3 --retry-all-errors --max-time 180 -fLsS 'https://www.dropbox.com/scl/fo/xn2lmolz4fbdyle8u67il/AAev7fQWfeI_OTlPysjKTrk?rlkey=bhhk9q0y1qzpm80k4lvzxgd26&st=k6egz5ga&dl=1' -o /tmp/balancas-dropbox.zip
          unzip -t /tmp/balancas-dropbox.zip
          unzip -jo /tmp/balancas-dropbox.zip '*.jpg' -d balancas
          mv balancas/IMG-20261120-WA9535.jpg balancas/desafio-01.jpg
          mv balancas/IMG-20261120-WA4075.jpg balancas/desafio-02.jpg
          mv balancas/IMG-20261120-WA3868.jpg balancas/desafio-03.jpg
          mv balancas/IMG-20261120-WA4794.jpg balancas/desafio-04.jpg
          mv balancas/IMG-20261120-WA7909.jpg balancas/desafio-05.jpg
          mv balancas/IMG-20261120-WA1893.jpg balancas/desafio-06.jpg
          mv balancas/IMG-20261120-WA7674.jpg balancas/desafio-07.jpg
          mv balancas/IMG-20261120-WA2840.jpg balancas/desafio-08.jpg
          mv balancas/IMG-20261120-WA9530.jpg balancas/desafio-09.jpg
          mv balancas/IMG-20261120-WA6148.jpg balancas/desafio-10.jpg
          test "$(find balancas -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 10
          cp balancas/*.jpg android/app/src/main/assets/balancas/
      - name: Upload balance images for verification
        uses: actions/upload-artifact@v4
        with:
          name: Balance-Images
          path: balancas/*.jpg
          retention-days: 14
      - name: Download today's 40 balance images from Dropbox for inspection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p balancas-novas
          curl --retry 3 --retry-all-errors --max-time 180 -fLsS 'https://www.dropbox.com/scl/fo/fcb3dat2zcjiw8rmipfqj/AFFO4GI2JyUDIUuSOPYwPys?rlkey=ug92c9s9xzi4vmvacav1tlyww&dl=1' -o /tmp/balancas-40.zip
          unzip -t /tmp/balancas-40.zip
          unzip -jo /tmp/balancas-40.zip '*.jpg' -d balancas-novas
          test "$(find balancas-novas -maxdepth 1 -type f -iname '*.jpg' | wc -l)" -eq 40
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          from pathlib import Path
          import csv
          files=sorted(Path("balancas-novas").glob("*.jpg"))
          rows=[]
          thumbs=[]
          for p in files:
              im=Image.open(p)
              rows.append((p.name, im.width, im.height, im.mode, p.stat().st_size))
              im.thumbnail((300,210))
              tile=Image.new("RGB",(320,250),"white")
              tile.paste(im,((320-im.width)//2,5))
              ImageDraw.Draw(tile).text((8,222),f"{p.name} | {rows[-1][1]}x{rows[-1][2]}",fill="black")
              thumbs.append(tile)
          with open("balancas-novas/relatorio-resolucao.csv","w",newline="",encoding="utf-8") as f:
              w=csv.writer(f); w.writerow(["arquivo","largura","altura","modo","bytes"]); w.writerows(rows)
          sheet=Image.new("RGB",(320*5,250*8),"#dddddd")
          for i,tile in enumerate(thumbs): sheet.paste(tile,((i%5)*320,(i//5)*250))
          sheet.save("balancas-novas/contato-40.jpg",quality=90)
          PY
      - name: Upload today's 40 images and visual contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: Balance-Images-40-Nov-21
          path: |
            balancas-novas/*.jpg
            balancas-novas/*.csv
          retention-days: 14
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Desafio-Logico-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
