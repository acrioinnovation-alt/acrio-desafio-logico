name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare offline game assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html game.js fases.js matchsticks.js balance.js visualpuzzles.js android/app/src/main/assets/
          mkdir -p android/app/src/main/assets/balancas
      - name: Download and permanently add the 10 balance puzzle images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p balancas android/app/src/main/assets/balancas
          curl -fLsS 'https://uccfe0a5ae138c70a71327bb1238.dl.dropboxusercontent.com/cd/0/get/DMSYe9iu9HynvNI1Rp3ThwcqcEux9EzOnJ1eOHPclGIkiFQOQ6Zyjer6-wb2PwzuW8D6dN21UAYjkl5eedbOKoY56WFvi_WzKN7wfy5Fr1jRZ9SELOI7L4vRCvpibt8diwP9lo3DOMZvfVnBCybJv1zMZd7rkfl2PSkocE9akHUAjg/file?c_luid=96c6d381' -o balancas/desafio-01.jpg
